name: Update Dad Joke
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
jobs:
  update-joke:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Fetch a dad joke
        id: joke
        run: |
          JOKE=$(curl -s -H "Accept: application/json" https://icanhazdadjoke.com/ | jq -r '.joke')
          echo "joke=$JOKE" >> $GITHUB_OUTPUT
          echo "timestamp=$(date -u '+%B %d, %Y at %H:%M UTC')" >> $GITHUB_OUTPUT
      - name: Update README
        env:
          JOKE: ${{ steps.joke.outputs.joke }}
          TIMESTAMP: ${{ steps.joke.outputs.timestamp }}
        run: |
          python3 -c "
          import re, os
          joke = os.environ['JOKE']
          timestamp = os.environ['TIMESTAMP']
          content = open('README.md').read()
          replacement = '<!-- DAD_JOKE_START -->\n> ' + joke + '\n\n*Added at: ' + timestamp + ', by [this action](https://github.com/SuperbMuffin/SuperbMuffin/blob/main/.github/workflows/dad_joke_action.yml)' + '*\n<!-- DAD_JOKE_END -->'
          content = re.sub(r'<!-- DAD_JOKE_START -->.*?<!-- DAD_JOKE_END -->', replacement, content, flags=re.DOTALL)
          open('README.md', 'w').write(content)
          "
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update dad joke"
          git push
